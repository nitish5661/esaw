<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp AI Reply</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .msg { background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 0 5px #ccc; }
    textarea { width: 100%; height: 60px; border-radius: 4px; }
    button { margin-top: 5px; padding: 6px 12px; border: none; background: #25D366; color: white; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1ebe5c; }
    #qr img { margin: 20px auto; display: block; }
  </style>
</head>
<body>
  <h2>WhatsApp AI Reply</h2>
  <div id="qr">Loading QR...</div>
  <div id="messages"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const qrDiv = document.getElementById('qr');
    const messagesDiv = document.getElementById('messages');

    socket.on('qr', (qrImg) => {
      qrDiv.innerHTML = `<img src="${qrImg}" width="300" />`;
    });

    socket.on('ready', () => {
      qrDiv.innerHTML = '<b>✅ WhatsApp Connected.</b>';
    });

    socket.on('messages', (msgs) => {
      messagesDiv.innerHTML = '';
      msgs.forEach((msg, i) => {
        const aiReply = i === msgs.length - 1 ? generateAIReply(msg.body) : '';
        messagesDiv.innerHTML += `
          <div class="msg">
            <b>From:</b> ${msg.from}<br/>
            <b>Message:</b> ${msg.body}<br/>
            <textarea id="reply${i}">${aiReply}</textarea><br/>
            <button onclick="sendReply('${msg.from}', 'reply${i}')">Send</button>
          </div>
        `;
      });
    });

    function sendReply(to, textareaId) {
      const msg = document.getElementById(textareaId).value;
      fetch('/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ to, message: msg })
      }).then(res => res.json()).then(console.log);
    }

    function generateAIReply(msg) {
      msg = msg.toLowerCase();
      if (msg.includes('hello')) return 'Hi! How can I help you?';
      if (msg.includes('price')) return 'Please let me know which product you are asking about.';
      if (msg.includes('thanks')) return 'You’re welcome!';
      return 'Thank you for your message!';
    }
  </script>
</body>
</html>
